<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Future Landing Page</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      text-align:center;
      max-width:700px;
      padding:40px;
      background: rgba(255,255,255,0.08);
      border-radius:20px;
      backdrop-filter: blur(10px);
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    h1{
      font-size:48px;
      margin-bottom:20px;
      color:#38bdf8;
    }

    p{
      font-size:18px;
      line-height:1.7;
      margin-bottom:30px;
      color:#e2e8f0;
    }

    .btn{
      text-decoration:none;
      background:#38bdf8;
      color:black;
      padding:14px 28px;
      border-radius:30px;
      font-weight:bold;
      transition:0.3s;
    }

    .btn:hover{
      background:white;
      transform:scale(1.05);
    }

    footer{
      margin-top:30px;
      font-size:14px;
      color:#cbd5e1;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>AI Agent Development</h1>

    <p>
      Welcome to the future of Artificial Intelligence.
      AI Agents can automate tasks, solve problems,
      and improve productivity using smart decision-making.
    </p>

    <a href="#" class="btn">Explore AI</a>

    <footer>
      Created by Vishnu Kumar Reddy | Internship Assignment 2026
    </footer>
  </div>

</body>
</html>
